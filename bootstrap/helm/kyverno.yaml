# Kyverno 3.9.2 -- the chart version is pinned in versions.env and resolves to
# the v1.19.2 image, so pinning the chart pins the admission controller.
#
# Only the webhook is installed. It is the component that runs cosign against a
# Pod at CREATE time; the background, cleanup and reports controllers exist to
# scan objects that already live in the cluster and to write PolicyReports. On a
# one-node kind cluster that is four more deployments and several hundred MB of
# images for a capability this demo does not demonstrate.
admissionController:
  replicas: 1
  container:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

backgroundController:
  enabled: false

cleanupController:
  enabled: false

reportsController:
  enabled: false

features:
  # Without the reports controllers these CRDs have nothing writing to them;
  # leaving the flags on would make the admission controller try to create
  # objects whose controller is not running.
  admissionReports:
    enabled: false
  policyReports:
    enabled: false
  backgroundScan:
    enabled: false

webhooksCleanup:
  # The pre-delete hook that removes the webhook configurations when the release
  # is deleted. It runs an image whose chart default is a moving tag
  # (`ghcr.io/kyverno/readiness-checker` with no tag, i.e. `latest`), and the
  # only tags published for it are commit SHAs -- neither acceptable under the
  # pinning rule in versions.env. The hook is also pointless here: `kind delete
  # cluster` takes the webhook configurations with the rest of the cluster, and
  # `bootstrap.sh --destroy` is the only teardown this project documents.
  enabled: false
