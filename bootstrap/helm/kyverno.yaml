# Kyverno 3.0.5 -- the chart version is pinned in versions.env and resolves to
# the v1.10.3 images, so pinning the chart pins the admission controller.
#
# Only the webhook is installed. It is the component that runs cosign against a
# Pod at CREATE time; the background, cleanup and reports controllers exist to
# scan objects that already live in the cluster and to write PolicyReports. On a
# one-node kind cluster that is four more deployments and 500 MB of images for a
# capability this demo does not demonstrate.
admissionController:
  replicas: 1
  container:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

backgroundController:
  enabled: false

cleanupController:
  enabled: false

reportsController:
  enabled: false

features:
  # Without the reports controllers these CRDs have nothing writing to them;
  # leaving the flags on would make the admission controller try to create
  # objects whose controller is not running.
  admissionReports:
    enabled: false
  policyReports:
    enabled: false
  backgroundScan:
    enabled: false

webhooksCleanup:
  # The chart's own default is `bitnami/kubectl:latest`. A pre-delete hook that
  # can change without a commit is exactly what the pins in versions.env exist
  # to prevent, so the tag is written out even though this container only runs
  # when the release is deleted.
  image: docker.io/bitnami/kubectl:1.26.4

cleanupJobs:
  # The two CronJobs the chart ships by default, both of which delete report
  # objects that this install never produces.
  admissionReports:
    enabled: false
  clusterAdmissionReports:
    enabled: false
